<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>直播吧 Modern</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="icons/icon48.png" width="36" height="36" alt="">
        <div class="brand-text">
          <h1>直播吧 <span>Modern</span></h1>
          <p>Zhibo8, reimagined.</p>
        </div>
      </div>
      <span class="version" id="version">v1.0.1</span>
    </header>

    <section class="power" aria-labelledby="power-title">
      <div class="power-top">
        <span class="status" id="status"><i aria-hidden="true"></i>已启用</span>
        <span class="site-tag">zhibo8.com</span>
      </div>
      <div class="power-row">
        <div class="power-copy">
          <h2 id="power-title">现代首页</h2>
          <p>重构导航、内容网格与赛程视图，页面仍然是原来的直播吧。</p>
        </div>
        <label class="switch switch-lime" aria-label="启用现代化主题">
          <input type="checkbox" id="enabled">
          <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
        </label>
      </div>
      <div class="power-rule" aria-hidden="true"></div>
      <div class="power-meta">
        <span>只在首页生效</span>
        <span>无追踪 · 无请求</span>
      </div>
    </section>

    <section class="panel" aria-labelledby="appearance-title">
      <div class="panel-heading">
        <h2 id="appearance-title">外观</h2>
        <span>APPEARANCE</span>
      </div>

      <fieldset class="theme-fieldset">
        <legend class="sr-only">选择主题</legend>
        <div class="theme-grid">
          <label class="theme-choice">
            <input type="radio" name="theme" value="auto">
            <span class="theme-preview preview-auto" aria-hidden="true"></span>
            <span class="theme-name">跟随系统</span>
            <span class="theme-check" aria-hidden="true"></span>
          </label>
          <label class="theme-choice">
            <input type="radio" name="theme" value="light">
            <span class="theme-preview preview-light" aria-hidden="true"></span>
            <span class="theme-name">浅色</span>
            <span class="theme-check" aria-hidden="true"></span>
          </label>
          <label class="theme-choice">
            <input type="radio" name="theme" value="dark">
            <span class="theme-preview preview-dark" aria-hidden="true"></span>
            <span class="theme-name">深色</span>
            <span class="theme-check" aria-hidden="true"></span>
          </label>
        </div>
      </fieldset>

      <div class="divider" role="presentation"></div>

      <div class="feature-row">
        <div class="feature-copy">
          <h3>顶部赛程速览</h3>
          <p>在首页导航下显示今日对阵，可横向浏览。</p>
        </div>
        <label class="switch" aria-label="显示顶部赛程速览">
          <input type="checkbox" id="matchbar">
          <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
        </label>
      </div>
    </section>

    <footer class="footer">
      <a class="repo-link" id="repo-link" href="https://github.com/niexia/zhibo8-modern" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
          <path d="M12 .7A11.5 11.5 0 0 0 8.36 23.1c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a10.96 10.96 0 0 1 5.78 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
        <span>GitHub 源码</span>
        <svg class="repo-arrow" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M8 7h9v9"/>
        </svg>
      </a>
      <p>非官方开源主题，与直播吧无隶属关系。</p>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
